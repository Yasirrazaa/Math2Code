[project]
name = "math2code"
version = "0.1.0"
description = "Translating LaTeX expressions into executable SymPy code with LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "pydantic>=2.7",
    "e2b_code_interpreter>=1.0.0",
    "tenacity>=8.3",
    "instructor>=1.2",
    "tqdm>=4.66",
    "openai>=1.14",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "gradio>=4.31",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "dvc>=3.51",
    "httpx>=0.27"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
