[project]
name = "math2code"
version = "0.2.0"
description = "Translating LaTeX expressions into executable SymPy code with LLMs (TIR + RLVR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "instructor>=1.2",
    "tqdm>=4.66",
    "openai>=1.14",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "gradio>=4.31",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU training stack (SFT + GRPO). Install with: uv pip install -e ".[train]"
train = [
    "torch>=2.1",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.14",
    "datasets>=2.20",
    "accelerate>=0.34",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "vllm>=0.8",
    "huggingface-hub>=0.24",
]
# Development / CI tooling. Install with: uv pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "httpx>=0.27",
    # E2B sandboxed final eval (e2e_eval.py, lazy import; needs E2B_API_KEY)
    "e2b-code-interpreter>=1.0.0",
    # sympy's latex parser hard-pins the antlr4 4.11.x line
    "antlr4-python3-runtime==4.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math2code"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    # thin Gradio UI script; gradio's typing is noise and it drags in huge stubs
    "src/math2code/serve/app.py",
]

[[tool.mypy.overrides]]
# openai's _extras import numpy; keep our thin client usage as Any
module = ["openai.*", "openai"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
