repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
# NOTE: mypy is deliberately NOT a pre-commit hook — it runs in an isolated
# env and would need numpy/openai stub mirroring. The real gates are CI and
# `make typecheck` (mypy src/math2code tests).
