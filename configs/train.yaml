model:
  base_model: "AI-MO/NuminaMath-7B-TIR"
  max_seq_length: 512

lora:
  r: 32
  lora_alpha: 64
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/aimo_lora"
  num_train_epochs: 5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 32
  learning_rate: 2e-4
  bf16: true
  optim: "adamw_torch"
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 1000
  save_total_limit: 2
  report_to: "wandb"  # Enables Weights & Biases logging

data:
  train_file: "./data/final/synthetic_data_final.json"
