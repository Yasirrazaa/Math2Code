model:
  base_model: "AI-MO/NuminaMath-7B-TIR"
  max_seq_length: 1024

lora:
  r: 32
  lora_alpha: 64
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./outputs/sft_lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 2e-4
  bf16: true
  optim: "adamw_torch"
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 500
  save_total_limit: 2
  report_to: "wandb"
  run_name: "math2code_sft_tir"
  format: "tir"  # "sft" | "tir"

data:
  # Competition data exported to JSON-lines (see scripts/export_train.py) or HF Hub
  train_file: "./data/train_curated.jsonl"
  # Data flywheel: verified synthetic mixture (make mixture). When use_mixture
  # is true and mixture_file exists, training uses it instead of train_file.
  # The frozen split is never modified by the flywheel.
  use_mixture: true
  mixture_file: "./data/synthetic/train_mixture_v1.jsonl"
